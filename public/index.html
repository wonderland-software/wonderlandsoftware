<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/rabbit-favicon-single.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />

    <title>Custom Software Development, Austin TX | Wonderland Software</title>
    <meta
      name="description"
      content="Custom web apps, mobile apps, AI agents, and Shopify builds for businesses in Austin, TX and beyond. Strategy first, then design, build, and deploy."
    />
    <link rel="canonical" href="https://wonderland.software/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/rabbit-favicon-single.png" />

    <!--
      Inter, loaded here rather than via @import in App.css. An @import forces
      the browser to download and parse the CSS before it can even discover
      the font, which serializes the requests and delays LCP. Only the weights
      the site actually uses (400/500/600/700) are requested.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph / Facebook / Slack / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wonderland.software/" />
    <meta property="og:site_name" content="Wonderland Software" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Custom Software Development, Austin TX | Wonderland Software"
    />
    <meta
      property="og:description"
      content="Custom web apps, mobile apps, AI agents, and Shopify builds for businesses in Austin, TX and beyond."
    />
    <meta property="og:image" content="https://wonderland.software/og-image.png" />
    <meta property="og:image:width" content="1570" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Wonderland Software" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Custom Software Development, Austin TX | Wonderland Software"
    />
    <meta
      name="twitter:description"
      content="Custom web apps, mobile apps, AI agents, and Shopify builds for businesses in Austin, TX and beyond."
    />
    <meta name="twitter:image" content="https://wonderland.software/og-image.png" />
    <meta name="twitter:image:alt" content="Wonderland Software" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Structured data. This is what Google's Knowledge Panel and AI answer
      engines read to understand who this business is and what it sells.
      Keep it truthful and in sync with the visible copy.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://wonderland.software/#organization",
            "name": "Wonderland Software",
            "url": "https://wonderland.software/",
            "email": "tag@wonderland.software",
            "logo": {
              "@type": "ImageObject",
              "url": "https://wonderland.software/og-image.png",
              "width": 1570,
              "height": 900
            },
            "description": "Wonderland Software builds custom web apps, mobile apps, AI agents, and Shopify storefronts for businesses.",
            "founder": {
              "@type": "Person",
              "name": "Tag Locklar",
              "jobTitle": "Founder",
              "email": "tag@wonderland.software"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Austin",
              "addressRegion": "TX",
              "addressCountry": "US"
            },
            "knowsAbout": [
              "Custom software development",
              "AI agents",
              "Workflow automation",
              "Web application development",
              "iOS app development",
              "React development",
              "Shopify development",
              "Systems integration"
            ]
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://wonderland.software/#service",
            "name": "Wonderland Software",
            "url": "https://wonderland.software/",
            "parentOrganization": {
              "@id": "https://wonderland.software/#organization"
            },
            "image": "https://wonderland.software/og-image.png",
            "email": "tag@wonderland.software",
            "priceRange": "$$$",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Austin",
              "addressRegion": "TX",
              "addressCountry": "US"
            },
            "areaServed": [
              { "@type": "City", "name": "Austin" },
              { "@type": "State", "name": "Texas" },
              { "@type": "Country", "name": "United States" }
            ],
            "serviceType": [
              "Custom software development",
              "AI agent development",
              "Workflow automation",
              "Web and mobile app development",
              "Shopify development",
              "Systems integration"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Strategy Conversations",
                    "description": "Before anything gets built, we map what your business actually needs, and what it doesn't."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Design & Development",
                    "description": "Web apps, mobile apps, and custom tools built to fit your business, shaped around the way your team actually works."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Integration & Deployment",
                    "description": "From proof-of-concept to production, wired into the systems and workflows you already rely on."
                  }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://wonderland.software/#website",
            "url": "https://wonderland.software/",
            "name": "Wonderland Software",
            "publisher": { "@id": "https://wonderland.software/#organization" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      Wonderland Software builds custom web apps, mobile apps, AI agents, and

    <div id="root"></div>
  </body>
</html>
